# Warq — Supabase configuration.
#
# project_id is set by `npm run db:link` once the Mumbai project exists.
# Everything else is checked in so every machine and CI run behaves the same.

project_id = "warq"

[api]
enabled = true
port = 54321
# Only `public` is exposed. `auth` and `storage` stay internal; anything a client
# needs from them goes through a function with an explicit signature.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# A roster query is bounded by class size, and no list in Warq is unbounded.
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
# Overridden per environment; the deployed values live in the dashboard.
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "warq://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Every account is created by invitation or by an approved request, so there is
# no open self-service signup to protect.
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[auth.email.template.invite]
subject = "You have been invited to join Warq"

[auth.sessions]
# A teacher marking attendance should not be signed out mid-lesson.
timebox = "720h"
inactivity_timeout = "0h"

[realtime]
enabled = true

[edge_runtime]
enabled = true
policy = "oneshot"

[analytics]
enabled = false
